<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Wound Healing Monitoring System
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>

    <nav class="navbar">

        <div class="logo">
            WoundCare
        </div>


        <div class="nav-links">

            {% if g.user %}

                <a href="{{ url_for('dashboard') }}">
                    Dashboard
                </a>

                <a href="{{ url_for('patients') }}">
                    Patients
                </a>

                <a href="#">
                    Wounds
                </a>

                {% if g.user.role == "ADMIN" %}

    <a href="{{ url_for('audit_trail') }}">
                        Audit Trail
                    </a>

                {% endif %}

                {% if g.user.role == "ADMIN" %}

                    <a href="{{ url_for('manage_users') }}">
                        Users
                    </a>

                {% endif %}


                <span class="logged-user">

                    {{ g.user.full_name }}
                    ({{ g.user.role }})

                </span>


                <a href="{{ url_for('logout') }}">
                    Logout
                </a>

            {% endif %}

        </div>

    </nav>


    <main class="main-container">

        {% block content %}
        {% endblock %}

    </main>


    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</body>

</html>
