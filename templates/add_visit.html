{% extends "base.html" %}

{% block title %}
Add Visit - WoundCare
{% endblock %}

{% block content %}

<section class="page-header">

    <h1>Add Wound Visit</h1>

    <p>
        Patient: {{ wound.patient.full_name }}
        |
        Wound: {{ wound.location }}
    </p>

</section>


<div class="form-container">

    <form
        method="POST"
        enctype="multipart/form-data"
    >

        <div class="form-group">

            <label>
                Visit Date
            </label>

            <input
                type="date"
                name="visit_date"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Length (cm)
            </label>

            <input
                type="number"
                step="0.01"
                min="0"
                name="length_cm"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Width (cm)
            </label>

            <input
                type="number"
                step="0.01"
                min="0"
                name="width_cm"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Depth (cm)
            </label>

            <input
                type="number"
                step="0.01"
                min="0"
                name="depth_cm"
            >

        </div>


        <div class="form-group">

            <label>
                Pain Level (0-10)
            </label>

            <input
                type="number"
                min="0"
                max="10"
                name="pain_level"
            >

        </div>


        <div class="form-group">

            <label>
                Wound Condition
            </label>

            <select name="wound_condition">

                <option value="">
                    Select condition
                </option>

                <option value="Improving">
                    Improving
                </option>

                <option value="Stable">
                    Stable
                </option>

                <option value="Worsening">
                    Worsening
                </option>

                <option value="Infected">
                    Suspected Infection
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>
                Notes
            </label>

            <textarea
                name="notes"
                rows="5"
            ></textarea>

        </div>


        <div class="form-group">

            <label>
                Wound Image
            </label>

            <input
                type="file"
                name="image"
                accept="image/*"
            >

        </div>


        <div class="form-actions">

            <a
                href="{{ url_for('patient_details', patient_db_id=wound.patient.id) }}"
                class="secondary-button"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="primary-button"
            >
                Save Visit
            </button>

        </div>

    </form>

</div>

{% endblock %}
