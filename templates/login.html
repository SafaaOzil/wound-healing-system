{% extends "base.html" %}

{% block title %}
Login - WoundCare
{% endblock %}

{% block content %}

<div class="login-page">

    <div class="login-card">

        <h1>WoundCare</h1>

        <p class="login-subtitle">
            Wound Healing Monitoring System
        </p>

        <form method="POST">

            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    required
                    autofocus
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    required
                >

            </div>


            <button
                type="submit"
                class="primary-button login-button"
            >
                Sign In
            </button>

        </form>

    </div>

</div>

{% endblock %}
