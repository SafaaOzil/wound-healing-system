{% extends "base.html" %}

{% block title %}
Edit Patient - WoundCare
{% endblock %}

{% block content %}

<section class="page-header">

    <h1>Edit Patient</h1>

    <p>
        Update patient information.
    </p>

</section>


<div class="form-container">

    <form method="POST">

        <div class="form-group">

            <label>
                Patient ID
            </label>

            <input
                type="text"
                value="{{ patient.patient_id }}"
                disabled
            >

        </div>


        <div class="form-group">

            <label>
                Full Name
            </label>

            <input
                type="text"
                name="full_name"
                value="{{ patient.full_name }}"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Birth Date
            </label>

            <input
                type="date"
                name="birth_date"
                value="{% if patient.birth_date %}{{ patient.birth_date.strftime('%Y-%m-%d') }}{% endif %}"
            >

        </div>


        <div class="form-actions">

            <a
                href="{{ url_for('patient_details', patient_db_id=patient.id) }}"
                class="secondary-button"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="primary-button"
            >
                Save Changes
            </button>

        </div>

    </form>

</div>

{% endblock %}
