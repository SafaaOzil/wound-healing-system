{% extends "base.html" %}

{% block title %}
Add Wound - WoundCare
{% endblock %}

{% block content %}

<section class="page-header">

    <h1>Add Wound</h1>

    <p>
        Patient: {{ patient.full_name }}
    </p>

</section>


<div class="form-container">

    <form method="POST">

        <div class="form-group">

            <label>
                Wound Location
            </label>

            <input
                type="text"
                name="location"
                placeholder="Example: Left lower leg"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Wound Type
            </label>

            <select name="wound_type">

                <option value="">
                    Select wound type
                </option>

                <option value="Pressure Injury">
                    Pressure Injury
                </option>

                <option value="Diabetic Ulcer">
                    Diabetic Ulcer
                </option>

                <option value="Venous Ulcer">
                    Venous Ulcer
                </option>

                <option value="Arterial Ulcer">
                    Arterial Ulcer
                </option>

                <option value="Surgical Wound">
                    Surgical Wound
                </option>

                <option value="Traumatic Wound">
                    Traumatic Wound
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

        </div>


        <div class="form-group">

            <label>
                Status
            </label>

            <select name="status">

                <option value="ACTIVE">
                    Active
                </option>

                <option value="HEALED">
                    Healed
                </option>

                <option value="CLOSED">
                    Closed
                </option>

            </select>

        </div>


        <div class="form-actions">

            <a
                href="{{ url_for('patient_details', patient_db_id=patient.id) }}"
                class="secondary-button"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="primary-button"
            >
                Save Wound
            </button>

        </div>

    </form>

</div>

{% endblock %}
