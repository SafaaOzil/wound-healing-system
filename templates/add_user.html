{% extends "base.html" %}

{% block title %}
Add User - WoundCare
{% endblock %}

{% block content %}

<section class="page-header">

    <h1>Add User</h1>

    <p>
        Create a new system user.
    </p>

</section>


<div class="form-container">

    <form method="POST">

        <div class="form-group">

            <label>
                Full Name
            </label>

            <input
                type="text"
                name="full_name"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Role
            </label>

            <select
                name="role"
                required
            >

                <option value="">
                    Select role
                </option>

                <option value="DOCTOR">
                    Doctor
                </option>

                <option value="NURSE">
                    Nurse
                </option>

                <option value="ADMIN">
                    Admin
                </option>

            </select>

        </div>


        <div class="form-actions">

            <a
                href="{{ url_for('manage_users') }}"
                class="secondary-button"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="primary-button"
            >
                Create User
            </button>

        </div>

    </form>

</div>

{% endblock %}
